[project]
name = "kronicle-sdk"
version = "0.7.6"
description = "SDK to read and write data on a Kronicle microservice"
authors = [
    { name = "Olivier Martineau", email = "olivier.martineau@irisa.fr" },
    { name = "Marius Garénaux", email = "marius.garenaux-gruau@irisa.fr" },
]
readme = "README.md"
license-files = ["LICENCE.md"]
requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
keywords = ["Kronicle", "Kronicle SDK", "Univ. Rennes", "IRISA"]

# ------ Dependencies
dependencies = ["requests>=2.34.2", "pydantic[email]>=2.14.1"]

# ------ Optional dependencies
[dependency-groups]
dev = [
    "black>=26.10.1",
    "commitizen>=4.19.2",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "ruff>=0.17.1",
    "uv-bump>=0.6.0",
]
test = [
    "bandit>=1.9.4",
    "black[jupyter]>=26.10.1",
    "ipykernel>=7.4.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "tox-uv>=1.37.0",
    "tox>=4.67.1",
]
build = ["build>=1.6.1", "setuptools>=84.2.1", "twine>=7.0.0", "wheel>=0.48.0"]

[project.urls]
Homepage = "https://github.com/logistica-dev/kronicle-sdk"
Documentation = "https://github.com/logistica-dev/kronicle-sdk/blob/latest_branch/README.md"
Repository = "https://github.com/logistica-dev/kronicle-sdk"


[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

# ----- Tool: uv
[tool.uv]
default-groups = ["dev", "test"]

# ----- Tool: black
[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py313', 'py314']

# ----- Tool: bandit
[tool.bandit]
exclude_dirs = ["tests", "build", ".venv"]
targets = ["src"]

# ----- Tool: commitizen
[tool.commitizen]
name = "cz_conventional_commits"
version_files = ["pyproject.toml:project.version"]
version_provider = "pep621"
pre_bump_hooks = ["scripts/commit/commitizen_pre_bump_hook.sh"]

# ----- Tool: pytest
[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["*.egg", ".eggs", "dist", "build", "wip"]
filterwarnings = ["ignore:.*pkg_resources.*:DeprecationWarning"]
addopts = [
    "--cov=kronicle_sdk",
    "--cov-report=term-missing",
    "--cov-report=html:reports/html_dir",
    "--cov-report=xml:reports/coverage.xml",
    # Deliberately no --cov-fail-under: coverage is reported, not enforced. The
    # CI badge publishes the real percentage (see .github/scripts/make_badges.py)
    # and a drop shows up as a colour change; gating the build on it would fail
    # CI for a metric rather than for a test result.
]

# ----- Tool: setuptools
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ----- Tool: pyright
[tool.pyright]
exclude = ["**/__pycache__", "**/.venv", "**/.env", "**/.vscode*"]
executionEnvironments = [{ root = ".", extraPaths = ["src"] }]
extraPaths = ["src"]
include = ["src", "tests"]
pythonVersion = "3.11"
reportArgumentType = "warning"
reportDuplicateImport = true
reportImportCycles = true
reportIncompatibleMethodOverride = "warning"
reportMissingImports = true
reportUnusedImport = true
venv = ".venv"
venvPath = "."
verboseOutput = true

# ----- Tool: Ruff
[tool.ruff]
# match Black
line-length = 120
exclude = ["**/.venv", "**/__pycache__", "**/.env"]

[tool.ruff.lint]
# common codes: E/F=flake8, I=imports, B=bugs, C=complexity
select = ["E", "F", "I", "B", "C"]
ignore = ["E501"]

# ----- Tool: tox
# Single source of truth for the checks run locally and in CI:
#   uv run tox                # all environments, serial
#   uv run tox run-parallel   # what CI runs (only py312 writes coverage)
#   uv run tox -e py312       # one environment
[tool.tox]
env_list = ["py311", "py312", "py313", "py314", "py315", "quality"]
skip_missing_interpreters = false

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
# The interpreter envs exist to prove the suite runs on each version, so only
# py312 (the dev interpreter, see [tool.tox.env.py312] below) instruments the
# run. Coverage is off everywhere else: it triples the test time, and measuring
# it under every version yields no extra information — the badge publishes a
# single percentage, and the line counts genuinely differ between versions
# (coverage.py's executable-line detection changed in 3.14), so comparing them
# compares different denominators.
commands = [["pytest", "-q", "-p", "no:cacheprovider", "--no-cov"]]

# The one env that produces the coverage reports the badge reads. It writes the
# shared reports/coverage.xml, which is safe precisely because no other env
# writes one — the interpreter envs run in parallel.
[tool.tox.env.py312]
commands = [["pytest", "-q", "-p", "no:cacheprovider"]]

[tool.tox.env.quality]
base_python = ["python3.12"]
dependency_groups = ["dev", "test"]
commands = [
    [
        "ruff",
        "check",
        "--no-fix",
    ],
    [
        "black",
        "--check",
        "--diff",
        ".",
    ],
    [
        "pyright",
    ],
    [
        "bandit",
        "-c",
        "pyproject.toml",
        "-r",
        "src",
    ],
]
