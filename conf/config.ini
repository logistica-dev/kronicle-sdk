; ==============================================================================
; This is a dummy configuration file.
;
; User configuration file can take a similar structure.
; Its path may be provided with the environment variable KRONICLE_SDK_CONF
;
; For each conf parameter, it is possible to provide an environmenet variable
; the name of which is provided above each parameter as -- <var_name>
; An environement variable takes precedence over a configuration file parameter.
; ==============================================================================

[kronicle_server]
; -- KRONICLE_HOST
host=localhost
; -- KRONICLE_PORT
port=8000

[kronicle_user]
; -- KRONICLE_USR_CREDS
credentials=TXlVc2VyOkFsbCBjYXRzIGFyZSBiZWF1dGlmdWwh
; You may compute this parameter with
;   echo -n '<username>:<password>' | basenc --base64 -w 0

; Alternatively, provide both following parameters
; -- KRONICLE_USR_NAME
username="MyUser"

; -- KRONICLE_USR_PASS
password="All cats are beautiful!"

; -- KRONICLE_USR_PB64
is_pwd_b64=False

[kronicle_su]
; These credentials are optional
; Can only be used if you are the application super-user
; (if you are running your own container for instance)

; -- KRONICLE_SU_CREDS
credentials=S3JvbmljbGVTVTozbDF0M1A0c3N3MHJkIQ

; alternatively you can provide both following parameters
; -- KRONICLE_SU_NAME
username="KronicleSU"

; -- KRONICLE_SU_PASS
password="M2wxdDNQNHNzdzByZCE"

; -- KRONICLE_SU_PB64
is_pwd_b64=True

[kronicle_sdk_log]
; -- KRONICLE_SDK_LOG_LEVEL
log_level=DEBUG
; log_level = NONE|ERROR|WARN|INFO|DEBUG
; log_level =   -1|    0|   1|   2|    3

; -- KRONICLE_SDK_LOG_FORMAT
log_format=SYSLOG
; log_format = SYSLOG|DEV

; -- KRONICLE_SDK_LOG_TZ
log_timezone=LOCAL
; log_timezone=NONE|LOCAL|UTC
