# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Linters run from the project venv (single version source via [dependency-groups]):
#   uv sync && uv run pre-commit run --all-files
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix # auto-fix issues
        language: system
        types: [python]
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: bandit
        name: bandit
        entry: bandit -c pyproject.toml -r src
        language: system
        pass_filenames: false
        types: [python]
      - id: commitizen-message
        name: commitizen message check
        entry: cz check --commit-msg-file
        language: system
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-docstring-first
      #      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.15 # match local uv? or latest
    hooks:
      - id: uv-lock
  # NOTE: commitizen-branch (pre-push version bump) removed — uv-bump now owns versioning.
