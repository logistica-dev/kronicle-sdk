name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tox:
    name: tox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-python: true

      # --locked fails if uv.lock is stale (same guarantee locally). It also
      # populates .venv, which [tool.pyright] venv/venvPath resolve against.
      # tox (via tox-uv) provisions the 3.11-3.14 interpreters for the matrix.
      - name: Run tox
        run: uv run --locked tox
